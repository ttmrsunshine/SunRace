/* SUNRACE – Oberfläche im Konsolen-Stil.
   Ein durchgehendes System: runde, fette Schrift; weiße Tafeln auf blauem Rautenmuster;
   dunkle, halbdurchsichtige Listenbalken über dem fahrenden Hintergrund; Auswahl immer gelb;
   unten eine Steuerleiste mit B (zurück) und A (weiter). Keine Schrägstellung, keine Kursivschrift. */
:root {
  --f: 'SR Round', ui-rounded, 'SF Pro Rounded', 'Arial Rounded MT Bold', 'Helvetica Neue', system-ui, sans-serif;
  --ink: #141a2e; --ink2: #222a44; --text: #1b2338; --muted: #66718c; --line: #d9e1ec; --paper: #ffffff; --paper2: #eef2f7; --paper3: #e2e8f1;
  --sky: #1f97ff; --sky2: #56c6ff; --blue: #1a7cf0; --blue-d: #0b4fb4;
  --sel: #ffd400; --sel2: #ffb800; --sel-d: #c78f00; --red: #ff3d2e; --red-d: #b8180c; --green: #27c457;
  --gold: #ffcf1a; --silver: #d4dde8; --bronze: #ec9548;
  --bar: rgba(14, 18, 34, .66); --bar-hi: rgba(255, 255, 255, .16);
  --r: 14px; --safe-b: max(10px, env(safe-area-inset-bottom)); --cbar-h: 58px;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sky); color: var(--text); font-family: var(--f); font-weight: 700; touch-action: manipulation; -webkit-user-select: none; user-select: none; overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
/* Hintergrund hinter durchsichtigem 3D-Bild (Garage, Optionen): blaues Rautenmuster */
#gl, .pat { background-color: var(--sky);
  background-image: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.28), rgba(255,255,255,0) 60%), linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(0,40,120,.22)),
    linear-gradient(45deg, rgba(255,255,255,.075) 25%, transparent 25% 75%, rgba(255,255,255,.075) 75%), linear-gradient(-45deg, rgba(255,255,255,.075) 25%, transparent 25% 75%, rgba(255,255,255,.075) 75%);
  background-size: 100% 100%, 100% 100%, 64px 64px, 64px 64px; background-position: 0 0, 0 0, 0 0, 32px 32px; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible { outline: none; }
input, select { font: inherit; color: var(--text); background: var(--paper2); border: 3px solid var(--line); border-radius: 12px; padding: 8px 12px; -webkit-user-select: text; user-select: text; }
input:focus { border-color: var(--sel2); }
h1, h2, h3, h4, h5 { font-weight: 800; margin: 0; letter-spacing: 0; text-wrap: balance; }
h4, h5 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--blue); margin: 14px 0 7px; }
h5 { margin: 0 0 6px; color: var(--muted); }
small { font-weight: 700; }
@keyframes selGlow { 0%, 100% { box-shadow: 0 0 0 4px var(--sel), 0 0 0 7px rgba(255,212,0,.25), 0 6px 14px rgba(0,0,0,.18); } 50% { box-shadow: 0 0 0 4px var(--sel), 0 0 0 10px rgba(255,212,0,.12), 0 6px 18px rgba(0,0,0,.18); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } }
@keyframes slideIn { from { opacity: 0; transform: translateX(-30px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { 40% { transform: scale(1.22); } }
@keyframes blink { 50% { opacity: .3; } }

/* ── UI-Ebene ─────────────────────────────────────────────── */
.ui { position: fixed; inset: 0; display: none; z-index: 10; overflow-y: auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.ui.show { display: flex; align-items: center; justify-content: center; }
.ui:not(.clear) { background-color: var(--sky); }
.ui:not(.clear):not(.dim) { background-image: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.28), rgba(255,255,255,0) 60%), linear-gradient(45deg, rgba(255,255,255,.075) 25%, transparent 25% 75%, rgba(255,255,255,.075) 75%), linear-gradient(-45deg, rgba(255,255,255,.075) 25%, transparent 25% 75%, rgba(255,255,255,.075) 75%);
  background-size: 100% 100%, 64px 64px, 64px 64px; background-position: 0 0, 0 0, 32px 32px; }
.ui.dim { background: rgba(8, 14, 34, .62); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.ui.menu { align-items: stretch; justify-content: flex-start; background: linear-gradient(90deg, rgba(8,14,34,.5) 0%, rgba(8,14,34,.18) 46%, rgba(8,14,34,0) 70%); }
.ui.hasbar { padding-bottom: calc(var(--cbar-h) + var(--safe-b) + 10px); }

/* Tafeln */
.panel { width: min(960px, 100%); max-height: 100%; overflow-y: auto; background: var(--paper); border-radius: 22px; padding: clamp(16px, 3vw, 28px); box-shadow: 0 8px 0 rgba(0,40,110,.18), 0 18px 40px rgba(0,20,70,.25); display: flex; flex-direction: column; gap: 10px; color: var(--text); }
.panel > * { flex-shrink: 0; } .panel.narrow { width: min(520px, 100%); } .panel.center { align-items: center; text-align: center; }
.panel h2 { font-size: clamp(24px, 3.6vw, 32px); font-weight: 900; color: var(--ink); display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.panel h2 small { font-size: 15px; color: var(--muted); }
.panel h3 { font-size: 19px; }
.note { color: var(--muted); font-size: 15px; margin: 4px 0; line-height: 1.4; }
.err { color: var(--red); min-height: 1.2em; margin: 4px 0; } .big-err { font-size: 18px; max-width: 40ch; color: var(--text); } .err.light { color: #fff; background: rgba(200,20,10,.6); padding: 8px 12px; border-radius: 10px; }
.hint-light { color: #fff; margin: 0; font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }

/* Bildschirm-Titel über Bild/Muster: weiß, fett, leichter Schatten – wie die Überschriften in Konsolenmenüs */
.scr-title, .sc-head h2 { font-size: clamp(26px, 4vw, 40px); font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,30,90,.35), 0 4px 14px rgba(0,0,0,.25); margin-right: auto; }

/* Knöpfe */
.big { font-size: clamp(19px, 2.6vw, 23px); font-weight: 900; padding: 12px 34px; border-radius: 999px; color: var(--ink); background: linear-gradient(180deg, #ffe45a, var(--sel) 45%, var(--sel2)); box-shadow: 0 5px 0 var(--sel-d), 0 10px 18px rgba(0,0,0,.18); transition: transform .08s, box-shadow .08s; }
.big:hover, .big:focus-visible { filter: brightness(1.05); box-shadow: 0 5px 0 var(--sel-d), 0 0 0 4px #fff, 0 10px 18px rgba(0,0,0,.18); }
.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sel-d); }
.big.on { background: linear-gradient(180deg, #7ff0a0, var(--green)); box-shadow: 0 5px 0 #138a3a; color: #fff; }
.big.s { padding: 9px 22px; font-size: 19px; }
.row { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 16px; border-radius: var(--r); background: var(--paper2); color: var(--text); min-height: 48px; transition: background .12s, box-shadow .12s; }
.row b { font-size: 17px; } .row small { color: var(--muted); font-size: 13px; }
.row:hover, .row:focus-visible { background: #fff; box-shadow: 0 0 0 4px var(--sel); }
.row.danger:hover, .row.danger:focus-visible { box-shadow: 0 0 0 4px var(--red); }
.row.slim { width: 100%; margin-top: 10px; padding: 9px 14px; min-height: 0; }
.ghost { color: var(--muted); padding: 10px 14px; border-radius: 10px; align-self: center; font-size: 17px; } .ghost:hover { color: var(--text); background: var(--paper2); }
.list { display: flex; flex-direction: column; gap: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin-top: 10px; }
.mini { padding: 6px 12px; border-radius: 10px; background: var(--paper2); font-size: 14px; color: var(--text); } .mini:hover, .mini:focus-visible { box-shadow: 0 0 0 3px var(--sel); background: #fff; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; } .pills.small .pill { padding: 6px 12px; font-size: 14px; }
.pill { padding: 8px 16px; border-radius: 999px; background: var(--paper2); color: var(--text); font-size: 15px; font-weight: 800; box-shadow: inset 0 0 0 2px var(--line); transition: box-shadow .1s, background .1s; }
.pill:hover:not(:disabled), .pill:focus-visible { box-shadow: inset 0 0 0 2px var(--line), 0 0 0 3px var(--sel); background: #fff; }
.pill.sel { background: linear-gradient(180deg, #ffe45a, var(--sel)); box-shadow: inset 0 0 0 2px var(--sel2), 0 3px 0 var(--sel-d); color: var(--ink); }
.pill:disabled { opacity: .8; cursor: default; }
.screen .pills .pill, .sc-head .pill { background: rgba(255,255,255,.92); }
.back { width: 46px; height: 46px; border-radius: 50%; background: #fff; color: var(--blue); display: grid; place-items: center; flex: none; box-shadow: 0 4px 0 rgba(0,40,110,.25); }
.back svg { width: 22px; }

/* Steuerleiste unten (B zurück · Mitte · A weiter) */
.cbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; height: calc(var(--cbar-h) + var(--safe-b)); padding: 0 max(14px, env(safe-area-inset-right)) var(--safe-b) max(14px, env(safe-area-inset-left));
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; background: linear-gradient(0deg, rgba(10,14,28,.9), rgba(10,14,28,.72)); box-shadow: 0 -1px 0 rgba(255,255,255,.12); color: #fff; }
.cb-mid { justify-self: center; font-size: 15px; color: rgba(255,255,255,.82); text-align: center; display: flex; gap: 10px; align-items: center; min-width: 0; }
.cb { display: inline-flex; align-items: center; gap: 9px; padding: 6px 16px 6px 6px; border-radius: 999px; font-size: 17px; font-weight: 800; color: #fff; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18); white-space: nowrap; transition: transform .08s, background .1s; }
.cb:hover, .cb:focus-visible { background: rgba(255,255,255,.2); box-shadow: inset 0 0 0 2px rgba(255,255,255,.4); }
.cb:active { transform: scale(.96); }
.cb .gl { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 900; font-size: 17px; background: #fff; color: var(--ink); flex: none; }
.cb-a { background: linear-gradient(180deg, #ffe45a, var(--sel) 50%, var(--sel2)); color: var(--ink); box-shadow: 0 3px 0 var(--sel-d); padding-right: 22px; font-size: 18px; }
.cb-a .gl { background: var(--ink); color: #fff; }
.cb-a:hover, .cb-a:focus-visible { background: linear-gradient(180deg, #fff07a, #ffe02a 50%, var(--sel)); box-shadow: 0 3px 0 var(--sel-d), 0 0 0 3px #fff; }
.cb-a.on { background: linear-gradient(180deg, #7ff0a0, var(--green)); box-shadow: 0 3px 0 #138a3a; color: #fff; }
.cb-x .gl { background: #4aa8ff; color: #fff; }

/* ── Titel ─────────────────────────────────────────────── */
.title { display: flex; flex-direction: column; align-items: center; gap: clamp(26px, 7vh, 64px); text-align: center; }
.brand { position: relative; display: inline-flex; flex-direction: column; align-items: flex-start; }
.brand b { position: relative; font-weight: 900; font-size: clamp(46px, 8vw, 88px); line-height: .92; letter-spacing: -.01em; color: #fff;
  -webkit-text-stroke: clamp(5px, .8vw, 8px) var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink), 0 12px 24px rgba(0,0,0,.3); }
.brand-sun { position: absolute; left: -.2em; top: -.35em; width: 1.25em; height: 1.25em; font-size: clamp(46px, 8vw, 88px); border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff2a0, var(--sel) 45%, #ff8a00); box-shadow: 0 0 0 .07em #fff, 0 0 40px rgba(255,180,0,.6); }
.brand small { position: relative; margin-top: 10px; font-size: clamp(14px, 2vw, 19px); color: #fff; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,.45); }
.big-brand { align-items: center; } .big-brand b { font-size: clamp(64px, 13vw, 150px); } .big-brand .brand-sun { font-size: clamp(64px, 13vw, 150px); left: 50%; top: -.42em; transform: translateX(-50%); width: 1.1em; height: 1.1em; opacity: .95; }
.press { display: inline-flex; align-items: center; gap: 12px; padding: 10px 26px 10px 10px; border-radius: 999px; background: rgba(10,14,28,.62); color: #fff; font-size: clamp(17px, 2.4vw, 22px); font-weight: 800; box-shadow: inset 0 0 0 2px rgba(255,255,255,.3); animation: blink 2s ease-in-out infinite; }
.press .gl { width: 38px; height: 38px; border-radius: 50%; background: var(--sel); color: var(--ink); display: grid; place-items: center; font-style: normal; font-weight: 900; }
.ver { color: rgba(255,255,255,.85); font-size: 13px; letter-spacing: .05em; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.ver.corner { position: fixed; right: max(14px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); }

/* ── Hauptmenü und Listen-Menüs: dunkle Balken mit runder Farbplakette ── */
.hm { display: flex; flex-direction: column; justify-content: center; gap: clamp(14px, 3vh, 26px); width: min(540px, 100%); padding-left: clamp(0px, 3vw, 44px); }
.hm.sub { justify-content: flex-start; padding-top: 4px; }
.hm .brand { margin-bottom: clamp(4px, 2vh, 18px); margin-left: .25em; }
.hm-list { display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 12px); }
.hm-row { position: relative; display: flex; align-items: center; gap: 14px; width: 100%; min-height: clamp(56px, 9vh, 70px); padding: 6px 18px 6px 8px; border-radius: 16px; text-align: left; color: #fff;
  background: var(--bar); box-shadow: inset 0 0 0 2px var(--bar-hi); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  animation: slideIn .35s cubic-bezier(.2,.9,.3,1.1) both; animation-delay: calc(var(--d, 0) * 60ms); transition: transform .1s, background .12s; }
.hm-row b { display: block; font-size: clamp(21px, 3vw, 28px); font-weight: 900; line-height: 1.05; }
.hm-row small { display: block; font-size: 13px; color: rgba(255,255,255,.72); margin-top: 2px; }
.hm-row:hover, .hm-row:focus-visible, .hm-row.sel { background: rgba(255,255,255,.96); color: var(--ink); animation: slideIn .35s both, selGlow 1.6s ease-in-out infinite; transform: translateX(6px); }
.hm-row:hover small, .hm-row:focus-visible small, .hm-row.sel small { color: var(--muted); }
.hm-row:active { transform: translateX(6px) scale(.98); }
.hm-ic { flex: none; width: clamp(44px, 7vh, 54px); height: clamp(44px, 7vh, 54px); border-radius: 50%; display: grid; place-items: center; padding: 9px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 0 0 3px #fff; color: rgba(0,0,0,.35); overflow: hidden; }
.hm-ic svg { width: 100%; height: 100%; display: block; } .hm-ic img { width: 120%; height: 120%; object-fit: cover; }
.hm-ic.sm { width: 34px; height: 34px; padding: 6px; display: inline-grid; vertical-align: middle; margin-right: 10px; }
.c-red { background: linear-gradient(180deg, #ff6a50, #e2261a); } .c-blue { background: linear-gradient(180deg, #4ab4ff, #1767e0); } .c-gold { background: linear-gradient(180deg, #ffd23a, #f09a00); }
.c-teal { background: linear-gradient(180deg, #3ce0c8, #0f9c9a); } .c-face { background: linear-gradient(180deg, #ffffff, #dde6f2); padding: 0; }
.hm-mini { display: flex; gap: 14px; animation: fadeUp .4s both .2s; }
.round-ic { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #fff; font-size: 12px; }
.round-ic svg { width: 50px; height: 50px; padding: 11px; border-radius: 50%; background: var(--bar); box-shadow: inset 0 0 0 2px var(--bar-hi); color: rgba(20,26,46,1); }
.round-ic small { text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.round-ic:hover svg, .round-ic:focus-visible svg { background: #fff; box-shadow: 0 0 0 4px var(--sel); }
.round-ic:hover svg path[fill="#fff"], .round-ic:focus-visible svg path[fill="#fff"] { fill: var(--ink); }
.round-ic:hover svg [stroke="#fff"], .round-ic:focus-visible svg [stroke="#fff"], .round-ic:hover svg circle[fill="#fff"], .round-ic:focus-visible svg circle[fill="#fff"] { stroke: var(--ink); }
.hm-desc { padding: 14px 18px; border-radius: 16px; background: rgba(255,255,255,.95); color: var(--text); box-shadow: 0 6px 18px rgba(0,0,0,.2); animation: fadeUp .35s both .15s; }
.hm-desc b { font-size: 20px; font-weight: 900; color: var(--ink); } .hm-desc p { margin: 4px 0 0; font-size: 15px; line-height: 1.4; color: var(--muted); }

/* ── Bildschirm-Gerüst ─────────────────────────────────── */
.screen { width: min(1080px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 14px; max-height: 100%; min-height: 0; }
.screen.wide { width: min(1220px, 100%); }
.sc-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.sc-body { overflow-y: auto; min-height: 0; flex: 1; padding: 4px; }
.sc-foot { display: flex; align-items: center; justify-content: flex-end; gap: 14px; flex-wrap: wrap; }
.mp2 { display: flex; flex-direction: column; gap: 16px; width: 100%; }
.join2 { padding: 16px 18px; border-radius: 18px; background: rgba(255,255,255,.96); box-shadow: 0 8px 20px rgba(0,0,0,.2); animation: fadeUp .4s both .1s; }
.join2 label { display: flex; align-items: center; font-size: 20px; font-weight: 900; color: var(--ink); }
.code-in { display: flex; gap: 8px; margin-top: 10px; } .code-in input { flex: 1; min-width: 0; font-size: 30px; font-weight: 900; letter-spacing: .25em; text-align: center; text-transform: uppercase; }

/* ── Cup-Wahl mit Fernseh-Vorschau ── */
.cupsel2 { display: grid; grid-template-columns: minmax(220px, 32%) 1fr; gap: 20px; align-items: start; }
.cs-left { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: rgba(255,255,255,.96); box-shadow: 0 8px 22px rgba(0,0,0,.2); }
.emblems { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.emb { width: clamp(72px, 12vmin, 112px); aspect-ratio: 1; border-radius: 22%; display: grid; place-items: center; position: relative; padding: clamp(12px, 2.2vmin, 18px); background: var(--paper2); box-shadow: inset 0 0 0 3px var(--line); transition: transform .12s; }
.emb svg { width: 100%; height: 100%; }
.emb:hover, .emb:focus-visible { background: #fff; }
.emb.sel { background: radial-gradient(circle at 50% 30%, #fffbe0, #fff2a8); box-shadow: inset 0 0 0 3px var(--sel2); animation: selGlow 1.6s ease-in-out infinite; transform: scale(1.04); }
.emb .medal { position: absolute; right: -8px; bottom: -8px; width: 36px; height: 36px; border-radius: 50%; background: #fff; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.emb .medal svg { width: 26px; height: 26px; } .medal.p2 svg path:first-child { fill: var(--silver); } .medal.p3 svg path:first-child { fill: var(--bronze); }
.cupname { font-size: clamp(20px, 2.8vw, 28px); font-weight: 900; color: var(--ink); }
.tv { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 9; background: #0a1020; box-shadow: 0 0 0 5px #fff, 0 12px 30px rgba(0,0,0,.35); }
.tv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tv img.in { animation: tvIn .5s ease-out; } @keyframes tvIn { from { opacity: .2; transform: scale(1.05); } }
.tv-name { position: absolute; left: 14px; bottom: 14px; display: flex; align-items: center; gap: 10px; padding: 5px 20px 5px 6px; border-radius: 999px; background: rgba(10,14,28,.78); color: #fff; z-index: 1; }
.tv-name span { width: 30px; height: 30px; border-radius: 50%; background: var(--sel); color: var(--ink); display: grid; place-items: center; font-size: 17px; font-weight: 900; }
.tv-name b { font-size: clamp(17px, 2.4vw, 24px); font-weight: 900; }
.tv-map { position: absolute; right: 10px; top: 10px; width: 26% !important; height: auto !important; aspect-ratio: 1; background: rgba(10,14,28,.55); border-radius: 14px; z-index: 1; }
.cs-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.cs-list li { display: flex; flex-direction: column; gap: 4px; padding: 5px; border-radius: 14px; background: #fff; cursor: pointer; animation: fadeUp .35s both; animation-delay: calc(var(--d) * 70ms); box-shadow: 0 4px 10px rgba(0,0,0,.15); }
.cs-list li img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; }
.cs-list li span { font-size: 13px; font-weight: 800; color: var(--text); line-height: 1.15; padding: 0 4px 3px; } .cs-list li small { color: var(--blue); margin-right: 5px; font-weight: 900; }
.cs-list li.on { box-shadow: 0 0 0 4px var(--sel), 0 4px 10px rgba(0,0,0,.15); }

/* ── Streckenwahl ── */
.tsel { display: grid; grid-template-columns: 1fr minmax(240px, 33%); gap: 16px; min-height: 0; }
.tgroups { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding: 6px; min-height: 0; }
.tg { display: grid; grid-template-columns: 50px repeat(4, minmax(0, 1fr)); gap: 9px; align-items: center; }
.tg .gi { width: 46px; height: 46px; border-radius: 30%; padding: 8px; background: rgba(255,255,255,.95); box-shadow: 0 3px 8px rgba(0,0,0,.18); }
.tcard { display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 5px 5px 7px; border-radius: 14px; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.15); transition: transform .12s, box-shadow .12s; }
.tcard img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; }
.tcard b { font-size: 13px; line-height: 1.1; text-align: center; color: var(--text); } .tcard em { font-style: normal; color: var(--blue); font-size: 12px; text-align: center; }
.tcard:hover, .tcard:focus-visible { transform: translateY(-2px); box-shadow: 0 0 0 3px #fff, 0 6px 14px rgba(0,0,0,.2); }
.tcard.sel { animation: selGlow 1.6s ease-in-out infinite; }
.tprev { background: #fff; border-radius: 22px; box-shadow: 0 8px 22px rgba(0,0,0,.2); padding: 12px; display: flex; flex-direction: column; gap: 8px; align-self: start; }
.tprev .tv { box-shadow: none; border-radius: 14px; } .tprev > img { display: none; }
.tprev b { font-size: 23px; font-weight: 900; color: var(--ink); line-height: 1.1; } .tprev p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.35; }
.tprev .diff { color: var(--sel2); letter-spacing: 3px; } .tprev em { font-style: normal; color: var(--text); }
.rules { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 12px; padding: 12px 16px; border-radius: 18px; background: rgba(255,255,255,.96); box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.rules label { display: flex; align-items: center; gap: 10px; font-size: 16px; }
.stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--paper2); border-radius: 999px; padding: 3px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; background: #fff; font-size: 20px; font-weight: 900; box-shadow: 0 2px 0 var(--line); } .stepper button:hover, .stepper button:focus-visible { box-shadow: 0 0 0 3px var(--sel); }
.stepper b { width: 34px; text-align: center; font-size: 20px; font-weight: 900; }

/* ── Fahrer & Kart / Figuren-Editor: Tafel links, Figur auf dem Sockel rechts ── */
.ui.garage-ui { padding-top: max(12px, env(safe-area-inset-top)); }
.gar { width: 100%; height: 100%; display: grid; grid-template-columns: minmax(320px, 56%) 1fr; gap: 16px; min-height: 0; }
.gar-panel { background: #fff; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; max-height: 100%; box-shadow: 0 8px 0 rgba(0,40,110,.18), 0 16px 34px rgba(0,20,70,.25); animation: fadeUp .3s both; }
.gar-panel > * { flex-shrink: 0; } .gar-panel > .gbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px; }
.gar-view { position: relative; min-height: 0; cursor: grab; touch-action: pan-y; }
.gtabs, .etabs { display: flex; gap: 6px; padding: 4px; border-radius: 16px; background: var(--paper2); overflow-x: auto; scrollbar-width: none; }
.gtabs::-webkit-scrollbar, .etabs::-webkit-scrollbar { display: none; }
.gtab { flex: 1; padding: 9px 14px; border-radius: 12px; font-size: 17px; font-weight: 900; color: var(--muted); white-space: nowrap; }
.gtab:hover, .gtab:focus-visible { color: var(--ink); background: #fff; }
.gtab.sel { background: #fff; color: var(--ink); box-shadow: 0 0 0 3px var(--sel), 0 3px 0 var(--sel-d); }
.etab { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 60px; padding: 6px 8px 4px; border-radius: 12px; color: var(--muted); font-size: 12px; font-weight: 800; }
.etab svg { width: 24px; height: 24px; } .etab:hover, .etab:focus-visible { background: #fff; color: var(--ink); }
.etab.sel { background: #fff; color: var(--ink); box-shadow: 0 0 0 3px var(--sel); }
/* Porträt-Raster */
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.ftile { position: relative; aspect-ratio: 1; border-radius: 16px; background: linear-gradient(180deg, #f6f9fc, #e1e8f1); box-shadow: inset 0 0 0 2px #d2dbe7; overflow: hidden; transition: transform .1s; }
.ftile img { width: 100%; height: 100%; display: block; object-fit: cover; }
.ftile:hover, .ftile:focus-visible { background: #fff; box-shadow: inset 0 0 0 2px #d2dbe7, 0 0 0 3px #fff, 0 0 0 6px rgba(255,212,0,.6); }
.ftile.sel { background: linear-gradient(180deg, #fffbe0, #ffeea0); animation: selGlow 1.6s ease-in-out infinite; z-index: 1; }
.own-badge { position: absolute; left: 6px; top: 6px; font-style: normal; font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 999px; background: var(--blue); color: #fff; }
/* Teile-Spalten (Karosserie | Reifen | Gleiter) */
.pcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; height: clamp(220px, 52vh, 460px); }
.pcol { display: flex; flex-direction: column; min-height: 0; background: var(--paper2); border-radius: 16px; padding: 8px; }
.pcol h5 { text-align: center; }
.plist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; padding: 6px 4px; scroll-snap-type: y proximity; scrollbar-width: thin; }
.ptile2 { scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 4px 6px; border-radius: 14px; background: #fff; box-shadow: 0 2px 0 var(--line); transition: transform .1s; }
.ptile2 img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; display: block; }
.ptile2 span { font-size: 12px; font-weight: 800; color: var(--text); text-align: center; line-height: 1.1; }
.ptile2:hover, .ptile2:focus-visible { box-shadow: 0 0 0 3px rgba(255,212,0,.7); }
.ptile2.sel { background: linear-gradient(180deg, #fffbe0, #fff1a0); animation: selGlow 1.6s ease-in-out infinite; }
.spoil { margin-top: 10px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 40px; height: 40px; border-radius: 50%; box-shadow: inset 0 0 0 3px rgba(255,255,255,.7), 0 0 0 2px var(--line); }
.swatches.big .sw { width: 50px; height: 50px; }
.sw:hover, .sw:focus-visible { transform: scale(1.08); }
.sw.sel { box-shadow: inset 0 0 0 3px #fff, 0 0 0 4px var(--sel), 0 3px 8px rgba(0,0,0,.25); transform: scale(1.1); }
/* Name + Werte über der Figur */
.gname { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); min-width: 60%; max-width: 100%; text-align: center; padding: 7px 22px 8px; border-radius: 14px; background: rgba(10,14,28,.8); color: #fff; pointer-events: none; }
.gname b { display: block; font-size: clamp(20px, 2.8vw, 28px); font-weight: 900; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gname small { display: block; font-size: 12px; color: rgba(255,255,255,.75); margin-top: 2px; }
.gstats { position: absolute; right: 0; top: 0; padding: 10px 14px 12px; border-radius: 16px; background: rgba(10,14,28,.78); color: #fff; min-width: 240px; pointer-events: none; }
.sp { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sp li { display: grid; grid-template-columns: 108px auto 34px; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; }
.segs { display: flex; gap: 2px; padding: 2px; border-radius: 6px; background: rgba(0,0,0,.35); }
.segs em { width: 11px; height: 12px; border-radius: 2px; background: rgba(255,255,255,.12); }
.segs em.on { background: linear-gradient(180deg, #fff27a, var(--sel) 55%, var(--sel2)); }
.segs em.up { background: linear-gradient(180deg, #a8ffb8, var(--green)); box-shadow: 0 0 6px rgba(39,196,87,.8); }
.segs em.down { background: transparent; box-shadow: inset 0 0 0 2px #ff6a5a; }
.sp small { font-size: 12px; font-weight: 900; } .sp small.pos { color: #7ff09a; } .sp small.neg { color: #ff8a7a; }
.stats { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.stat { display: grid; grid-template-columns: 120px 1fr; align-items: center; gap: 10px; font-size: 15px; }
.bar { height: 12px; border-radius: 6px; background: var(--paper3); overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sel), var(--sel2)); transition: width .3s; }
/* Editor-Bausteine */
.ed-top { display: flex; gap: 8px; } .ed-top input { flex: 1; min-width: 0; font-size: 20px; font-weight: 900; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.opt { padding: 10px 8px; border-radius: 12px; background: var(--paper2); font-size: 15px; font-weight: 800; min-height: 46px; color: var(--text); box-shadow: inset 0 0 0 2px var(--line); }
.opt:hover, .opt:focus-visible { background: #fff; box-shadow: inset 0 0 0 2px var(--line), 0 0 0 3px rgba(255,212,0,.7); }
.opt.sel { background: linear-gradient(180deg, #ffe45a, var(--sel)); box-shadow: inset 0 0 0 2px var(--sel2), 0 3px 0 var(--sel-d); color: var(--ink); }
.tog { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 16px; cursor: pointer; } .tog input { width: 22px; height: 22px; accent-color: var(--blue); }
.sliders { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.slider { display: grid; grid-template-columns: 76px 34px 1fr 34px; align-items: center; gap: 6px; font-size: 15px; }
.slider small { color: var(--muted); font-size: 11px; text-align: center; }
.slider input[type=range], .sl input[type=range] { -webkit-appearance: none; appearance: none; height: 12px; border-radius: 8px; background: var(--paper3); border: 0; padding: 0; }
.slider input[type=range]::-webkit-slider-thumb, .sl input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: var(--sel); border: 4px solid #fff; box-shadow: 0 0 0 2px var(--sel-d), 0 3px 6px rgba(0,0,0,.25); }
.slider input[type=range]::-moz-range-thumb, .sl input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--sel); border: 4px solid #fff; }

/* Optionen */
.seg { display: flex; border-radius: 14px; overflow: hidden; background: var(--paper2); padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 9px 6px; font-size: 15px; font-weight: 800; border-radius: 11px; color: var(--muted); }
.seg button:hover, .seg button:focus-visible { background: #fff; color: var(--ink); }
.seg button.sel { background: linear-gradient(180deg, #ffe45a, var(--sel)); color: var(--ink); box-shadow: 0 2px 0 var(--sel-d); }
.sl { display: flex; align-items: center; gap: 12px; font-size: 16px; } .sl input[type=range] { flex: 1; } .sl input[type=text], .sl select { flex: 1; min-width: 0; }

/* Ergebnisse, Podest */
.results table { width: 100%; border-collapse: separate; border-spacing: 0 5px; font-size: clamp(15px, 2vw, 18px); font-variant-numeric: tabular-nums; }
.results th { text-align: left; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 10px; }
.results td { padding: 8px 10px; background: var(--paper2); } .results td:first-child { border-radius: 12px 0 0 12px; font-weight: 900; width: 46px; text-align: center; } .results td:last-child { border-radius: 0 12px 12px 0; }
.results td i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 0 2px #fff, 0 0 0 3px var(--line); vertical-align: -1px; }
.results tr.me td { background: linear-gradient(180deg, #fff6b0, #ffe766); }
.results tr.p1 td:first-child { background: var(--gold); color: #5a3a00; } .results tr.p2 td:first-child { background: var(--silver); } .results tr.p3 td:first-child { background: var(--bronze); color: #fff; }
.results .sub { color: var(--muted); margin: 0; } .results small { color: var(--muted); font-size: 12px; }
.podium-ui { width: 100%; height: 100%; display: flex; flex-direction: column; gap: 12px; justify-content: flex-start; align-items: center; text-align: center; }
.pd-head h2 { font-size: clamp(26px, 5vw, 44px); font-weight: 900; color: #fff; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
.pd-head p { font-size: 20px; margin: 6px 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.4); }
.trophy { width: 84px; margin: 0 auto; animation: pop 2s infinite; } .trophy.p2 svg path:first-child { fill: var(--silver); } .trophy.p3 svg path:first-child { fill: var(--bronze); }
.pd-list { list-style: none; padding: 0; margin: auto 0 0; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.pd-list li { background: #fff; border-radius: 14px; padding: 8px 16px; font-size: 18px; box-shadow: 0 5px 0 rgba(0,40,110,.2); } .pd-list li span { color: var(--muted); margin-left: 8px; }
.pd-list .p1 b { color: #d89a00; } .pd-list .p2 b { color: #7d8ba0; } .pd-list .p3 b { color: var(--bronze); }
.pd-list .p2 { order: 1; } .pd-list .p1 { order: 2; transform: translateY(-10px) scale(1.08); } .pd-list .p3 { order: 3; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 4; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 3px; opacity: .95; animation: confFall linear infinite; }
@keyframes confFall { 0% { transform: translate3d(0, -20px, 0) rotate(0deg); } 100% { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); } }

/* Anleitung */
.help .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; } .help p, .help li { line-height: 1.45; color: var(--text); font-weight: 600; }
.keys { padding-left: 18px; margin: 0; } kbd { font-family: var(--f); background: var(--paper2); border-radius: 6px; padding: 0 7px; font-size: 14px; box-shadow: 0 2px 0 var(--line); }
.c-blue-t { color: #2a8aff; } .c-orange { color: #ff7a1a; }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.it { display: grid; grid-template-columns: 46px 1fr; column-gap: 10px; align-items: start; background: var(--paper2); border-radius: 14px; padding: 10px; }
.it .ic { grid-row: span 2; width: 46px; height: 46px; } .it small { color: var(--muted); font-size: 14px; line-height: 1.3; font-weight: 600; }

/* Online-Lobby */
.lobby2 .codeplate { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 4px var(--sel), 0 6px 14px rgba(0,0,0,.2); }
.codeplate small { color: var(--muted); text-transform: uppercase; letter-spacing: .12em; font-size: 12px; }
.code { font-size: clamp(30px, 4.6vw, 44px); font-weight: 900; letter-spacing: .16em; color: var(--ink); line-height: 1; -webkit-user-select: text; user-select: text; }
.netinfo { width: 100%; color: #fff; font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.lb2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; min-height: 0; overflow-y: auto; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
.slot { display: grid; grid-template-columns: 44px 1fr auto; grid-template-rows: auto auto; align-items: center; column-gap: 10px; padding: 8px 12px 8px 8px; border-radius: 16px; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.14), inset 5px 0 0 var(--kc, #ccc); }
.slot img { width: 44px; height: 44px; border-radius: 12px; grid-row: span 2; background: var(--paper2); object-fit: cover; }
.slot .no { grid-row: span 2; font-size: 22px; font-weight: 900; color: rgba(255,255,255,.8); text-align: center; } .slot .who { min-width: 0; }
.slot .who b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .slot .who small { color: var(--muted); font-size: 12px; }
.slot .st { grid-column: 3; font-size: 13px; color: var(--muted); } .slot.ready .st { color: var(--green); }
.slot .ping { grid-column: 2; font-size: 12px; } .slot .tag { grid-column: 3; grid-row: 1; justify-self: end; }
.slot.me { box-shadow: 0 0 0 4px var(--sel), 0 4px 10px rgba(0,0,0,.14), inset 5px 0 0 var(--kc, #ccc); }
.slot.empty { background: rgba(10,14,28,.45); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); color: #fff; } .slot.empty .who small { color: rgba(255,255,255,.7); }
.tag { background: var(--blue); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
.ping { font-size: 13px; color: var(--green); font-variant-numeric: tabular-nums; } .ping.mid { color: #e09a00; } .ping.bad { color: var(--red); }
.rules2 { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 20px; background: #fff; box-shadow: 0 8px 20px rgba(0,0,0,.2); align-self: start; }
.rules2 h4 { margin: 0; } .rules2 h4 small { color: var(--muted); text-transform: none; letter-spacing: 0; }
.tpick { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.tpick-c { display: flex; align-items: center; gap: 12px; background: var(--paper2); border-radius: 14px; padding: 8px; } .tpick-c img { width: 60px; height: 60px; border-radius: 10px; } .tpick-c b { font-size: 18px; }
.arrowbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--paper2); color: var(--ink); display: grid; place-items: center; } .arrowbtn svg { width: 18px; } .arrowbtn.r svg { transform: scaleX(-1); }
.arrowbtn:disabled { opacity: .35; } .arrowbtn:hover:not(:disabled), .arrowbtn:focus-visible { background: #fff; box-shadow: 0 0 0 3px var(--sel); }
.pill.cuppill { display: inline-flex; align-items: center; gap: 6px; } .pill.cuppill svg { width: 22px; height: 22px; }
.spinner { width: 56px; height: 56px; border-radius: 50%; border: 6px solid var(--paper3); border-top-color: var(--sel2); animation: spin 1s linear infinite; }
.toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 50; background: rgba(10,14,28,.9); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 16px; box-shadow: 0 6px 16px rgba(0,0,0,.3); transition: opacity .5s, transform .5s; max-width: calc(100% - 32px); }
.toast.out { opacity: 0; transform: translate(-50%, -12px); }

/* ── HUD ──────────────────────────────────────────────────
   Oben links Item, rechts Platz (am Handy oben, sonst unten rechts), unten links Münzen + Runde,
   rechts eine Spalte mit den Gesichtern der Fahrer in Rangfolge. */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; font-family: var(--f); font-weight: 900; color: #fff;
  --gx: max(14px, env(safe-area-inset-left)); --gr: max(14px, env(safe-area-inset-right)); --gt: max(10px, env(safe-area-inset-top)); --gb: max(12px, env(safe-area-inset-bottom)); --slot: clamp(64px, 10vmin, 100px); --ol: 0 2px 0 rgba(0,0,0,.45); }
#hud.show { display: block; }
.h-item { position: absolute; left: var(--gx); top: var(--gt); width: var(--slot); aspect-ratio: 1; border-radius: 24%; background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.28), rgba(10,14,28,.55) 70%); box-shadow: inset 0 0 0 5px #fff, 0 4px 0 rgba(0,0,0,.25); display: grid; place-items: center; }
.h-item-in { width: 72%; height: 72%; } .h-item-in svg { width: 100%; height: 100%; display: block; }
.h-item.spin { animation: shake .15s infinite; } .h-item.got { animation: pop .35s; }
@keyframes shake { 50% { transform: rotate(3deg); } }
.h-item b { position: absolute; right: -8px; bottom: -8px; font-size: 22px; color: var(--sel); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
.h-item small { position: absolute; top: calc(100% + 6px); left: 0; white-space: nowrap; font-size: clamp(12px, 1.7vmin, 15px); font-weight: 800; text-shadow: var(--ol), 0 0 6px rgba(0,0,0,.4); }
.h-rocket { position: absolute; right: -14px; top: -10px; width: 30px; height: 30px; border-radius: 50%; background: var(--red); color: #fff; font-style: normal; font-size: 22px; display: none; place-items: center; box-shadow: 0 0 0 3px #fff; animation: blink .4s infinite; }
.h-rocket.show { display: grid; }
.h-pos { position: absolute; right: var(--gr); bottom: calc(var(--gb) + 4px); text-align: right; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 4px; }
.h-place { font-size: clamp(70px, 15vmin, 140px); line-height: .9; color: #fff; -webkit-text-stroke: clamp(6px, 1.1vmin, 10px) var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
.h-place sup { font-size: .42em; vertical-align: 1.05em; margin-left: 2px; } .h-place small { font-size: .26em; color: #fff; margin-left: 2px; -webkit-text-stroke: 4px var(--ink); }
.h-place.p1 { color: var(--gold); } .h-place.p2 { color: #e8eef6; } .h-place.p3 { color: var(--bronze); } .h-place.p4 { color: #7cc8ff; } .h-place.pop { animation: pop .3s; }
.h-meta { display: flex; gap: 10px; align-items: center; background: rgba(10,14,28,.62); padding: 4px 14px; border-radius: 999px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); }
.h-lap { font-size: clamp(15px, 2.4vmin, 20px); color: var(--sel); } .h-time { font-weight: 800; font-size: clamp(15px, 2.2vmin, 19px); font-variant-numeric: tabular-nums; }
.h-coins { position: absolute; left: var(--gx); bottom: var(--gb); display: flex; align-items: center; gap: 8px; padding: 4px 16px 4px 6px; border-radius: 999px; background: rgba(10,14,28,.62); box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); font-size: clamp(18px, 3vmin, 26px); }
.h-coins i { width: 1.15em; height: 1.15em; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff6a8, #ffcc1a 55%, #e09000); box-shadow: inset 0 0 0 2px #b87800; }
.h-rank { position: absolute; right: var(--gr); top: 50%; transform: translateY(-50%); list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.h-rank li { position: relative; width: clamp(34px, 5.4vmin, 46px); height: clamp(34px, 5.4vmin, 46px); border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--kc, #888), 0 2px 4px rgba(0,0,0,.3); overflow: hidden; transition: transform .25s; }
.h-rank li img { width: 100%; height: 100%; object-fit: cover; display: block; }
.h-rank li b { position: absolute; left: -2px; bottom: -2px; font-size: 11px; color: #fff; background: rgba(10,14,28,.8); border-radius: 6px; padding: 0 3px; line-height: 1.3; }
.h-rank li.me { box-shadow: 0 0 0 3px var(--sel), 0 0 10px rgba(255,212,0,.9); transform: scale(1.12); z-index: 1; }
.h-map { position: absolute; left: var(--gx); bottom: calc(var(--gb) + 52px); width: clamp(100px, 16vmin, 170px); height: auto; aspect-ratio: 1; opacity: .95; filter: drop-shadow(0 3px 4px rgba(0,0,0,.4)); }
.h-speed { position: absolute; left: 50%; bottom: calc(var(--gb) + 6px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; }
.h-speed span, .h-speed small, .h-speed em { display: none; }
.h-drift { width: 160px; height: 12px; border-radius: 7px; background: rgba(10,14,28,.55); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); overflow: hidden; opacity: 0; transition: opacity .15s; }
.h-drift.on { opacity: 1; } .h-drift i { display: block; height: 100%; width: 0; background: #fff6d0; }
.h-drift.lv1 i { background: linear-gradient(90deg, #3a8aff, #8ad0ff); } .h-drift.lv2 i { background: linear-gradient(90deg, #ff5a1a, #ffb52e); }
.h-center { position: absolute; inset: 0; display: grid; place-items: center; }
.h-center .cd { display: block; text-align: center; font-size: clamp(110px, 26vmin, 220px); color: #fff; -webkit-text-stroke: 10px var(--ink); paint-order: stroke fill; text-shadow: 0 9px 0 var(--ink); animation: cd 1s ease-out; }
@keyframes cd { from { transform: scale(1.8); opacity: 0; } 30% { opacity: 1; transform: scale(1); } }
.h-trk { align-self: end; margin-bottom: 20vh; text-align: center; padding: 10px 26px 12px; border-radius: 20px; background: rgba(10,14,28,.62); }
.h-trk em { display: block; font-style: normal; letter-spacing: .1em; text-transform: uppercase; font-size: 14px; color: var(--sel); }
.h-trk small { display: block; font-size: clamp(30px, 7vmin, 56px); color: #fff; line-height: 1.1; } .h-trk span { font-size: 16px; font-weight: 700; color: rgba(255,255,255,.85); }
.h-msgs { position: absolute; left: 0; right: 0; top: 24%; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 18%; text-align: center; }
.msg { font-size: clamp(24px, 5vmin, 42px); color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); animation: msg .35s ease-out; }
.msg.go { color: var(--sel); font-size: clamp(64px, 16vmin, 150px); } .msg.final { color: #ff6a5a; } .msg.finish { color: var(--gold); font-size: clamp(56px, 13vmin, 120px); }
.msg.hit { color: #ff8ad0; } .msg.good { color: #7ae6ff; } .msg.item { color: var(--sel); font-size: clamp(20px, 4vmin, 30px); }

.t-pause { position: absolute; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); width: 52px; height: 40px; border-radius: 999px; background: rgba(10,14,28,.55); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); color: #fff; font-size: 14px; }
